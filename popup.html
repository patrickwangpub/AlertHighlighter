<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html { background: #fff; color-scheme: light; }
  body { width: 260px; margin: 0; padding: 16px; background: #fff; color: #202124;
         font: 13px/1.5 "Segoe UI", system-ui, sans-serif; }
  .count { font-size: 28px; font-weight: 600; line-height: 1.1; }
  .label { color: #5f6368; margin-bottom: 14px; }
  .green { color: #1e8e3e; font-weight: 600; }
  .muted { color: #5f6368; font-size: 11.5px; }
  button { font: inherit; width: 100%; padding: 9px 12px; margin-top: 12px;
           border: 1px solid #1e8e3e; background: #1e8e3e; color: #fff;
           border-radius: 6px; cursor: pointer; }
  button:hover { background: #197a35; }
  button:disabled { opacity: .6; cursor: default; }
</style>
</head>
<body>
  <div class="count" id="count">&mdash;</div>
  <div class="label">alerts on the bulk-close list</div>
  <div id="page" class="muted"></div>
  <button id="refresh">Refresh</button>
  <div class="muted" id="msg" style="margin-top:8px"></div>
  <script src="popup.js"></script>
</body>
</html>
