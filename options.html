<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Alert Bulk-Close Highlighter - list settings</title>
<style>
  html { background: #fff; color-scheme: light; }
  body { max-width: 680px; margin: 0 auto; padding: 28px 24px;
         font: 14px/1.55 "Segoe UI", system-ui, sans-serif; color: #202124;
         background: #fff; color-scheme: light; }
  h1 { font-size: 19px; margin: 0 0 16px; }
  h2 { font-size: 14px; margin: 26px 0 6px; }
  .card { background: #f1f3f4; border-radius: 8px; padding: 14px 16px; margin: 12px 0; }
  .total { font-size: 26px; font-weight: 600; }
  button { font: inherit; padding: 8px 14px; margin: 4px 8px 4px 0;
           border: 1px solid #dadce0; background: #f8f9fa; border-radius: 6px; cursor: pointer; }
  button:hover { background: #e8f0fe; }
  button.primary { background: #1e8e3e; color: #fff; border-color: #1e8e3e; }
  button.primary:hover { background: #197a35; }
  button:disabled { opacity: .5; cursor: default; }
  table { border-collapse: collapse; width: 100%; margin-top: 10px; font-size: 13px; }
  th, td { border-bottom: 1px solid #e0e0e0; padding: 6px 8px; text-align: left; }
  th { color: #5f6368; font-weight: 600; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .muted { color: #5f6368; font-size: 12.5px; }
  .warn { color: #c5221f; }
  .ok { color: #1e8e3e; }
  code { background: #e8eaed; padding: 1px 5px; border-radius: 3px; font-size: 12px;
         word-break: break-all; }
  textarea { width: 100%; height: 70px; box-sizing: border-box; font: 12px monospace; }
  details { margin-top: 26px; }
  summary { cursor: pointer; color: #1a73e8; font-size: 13px; }
</style>
</head>
<body>
  <h1>Bulk-close list settings</h1>

  <div class="card">
    <div><span class="total" id="total">0</span> alert IDs loaded</div>
    <div class="muted" id="syncline">Never refreshed</div>
    <div class="muted" id="route"></div>
  </div>

  <h2>Shared folder</h2>
  <div class="muted">Set in <code>config.js</code>:</div>
  <div style="margin:6px 0"><code id="folderPath">(not set)</code></div>
  <div id="routeHelp" class="muted"></div>
  <div style="margin-top:10px">
    <button class="primary" id="refresh">Refresh from folder</button>
    <button id="pickFolder">Point Chrome at this folder&hellip;</button>
    <button id="forget" disabled>Forget folder</button>
  </div>
  <input type="file" id="folderInput" webkitdirectory directory multiple
         style="display:none">

  <table id="files" style="display:none">
    <thead><tr><th>File</th><th class="num">IDs</th></tr></thead>
    <tbody></tbody>
  </table>

  <div id="status" class="muted" style="margin-top:14px"></div>

  <details>
    <summary>Manual loading and matching details</summary>

    <h2>Load files by hand</h2>
    <input type="file" id="fileInput" accept=".csv,.txt,.tsv" multiple>
    <div class="muted">Replaces the current list with the files you pick.</div>

    <h2>Paste IDs</h2>
    <textarea id="paste" placeholder="A1234, A1235, A1236"></textarea>
    <div>
      <button id="addPaste">Add to list</button>
      <button id="clear">Clear entire list</button>
    </div>

    <h2>Matching</h2>
    <div class="muted" id="cfgInfo"></div>
  </details>

  <script src="config.js"></script>
  <script src="idlist.js"></script>
  <script src="lists.js"></script>
  <script src="options.js"></script>
</body>
</html>
